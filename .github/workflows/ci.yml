name: CI

# Checks pull requests (for example Dependabot) without touching GitHub or the live site.

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run the tests
        run: node --test "tests/**/*.test.mjs"

      - name: Build from saved answers
        run: node scripts/build.mjs --offline tests/fixtures --out "$RUNNER_TEMP/site"

      - name: Check the links
        run: node scripts/check-links.mjs "$RUNNER_TEMP/site" --allow=/cv.pdf
