name: Build and deploy the site

# The site is built from the files in data/ and assets/. It builds on every push and when started by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The resume repo sends this after it builds new PDFs.
  repository_dispatch:
    types: [resume-updated]

permissions:
  contents: read
  pages: write
  id-token: write

# Runs wait for each other. A deploy is never cancelled half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Get the latest resume PDFs (only the two the site links to). If this fails, the PDFs saved in data/ are
      # used and the run shows a warning in its summary (no email).
      - name: Download the latest resumes
        env:
          GH_TOKEN: ${{ secrets.RESUME_TOKEN }}
        run: |
          if gh release download latest -R shlokkvaishnav/resume -D data --clobber \
               -p 'Shlok_Vaishnav_Resume.pdf' -p 'Shlok_Vaishnav_Resume_Research.pdf'; then
            echo "Downloaded the latest resumes."
          else
            echo "::warning::Could not download the latest resumes (is the RESUME_TOKEN secret set and valid?). Using the PDFs saved in data/."
          fi

      - name: Run the tests
        run: node --test "tests/**/*.test.mjs"

      # A failed build does not deploy, so the live site stays as it is.
      - name: Build the site
        run: node scripts/build.mjs

      - name: Check the links
        run: node scripts/check-links.mjs dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
